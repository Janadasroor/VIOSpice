name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" linux desktop 6.11.0 linux_gcc_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools qttasktree
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.11.0/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" mac desktop 6.11.0 clang_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools qttasktree
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.11.0/macos/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/Scripts/pip install aqtinstall
          /tmp/qt-env/Scripts/aqt install-qt --outputdir "${{ runner.temp }}/Qt" windows desktop 6.11.0 win64_msvc2022_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools qttasktree
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.11.0/msvc2022_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y \
            build-essential cmake \
            libcurl4-openssl-dev \
            python3 python3-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake curl python@3.12

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake curl python3

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure || echo "Tests completed (some may not apply)"
