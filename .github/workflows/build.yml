name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" linux desktop 6.10.0 linux_gcc_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" mac desktop 6.10.0 clang_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/macos/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y software-properties-common ccache
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            llvm-21-dev \
            python3 python3-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake curl python@3.12 ccache

      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      - name: Setup MSYS2 + Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-llvm
            zip

      - name: Set Qt6_DIR (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "Qt6_DIR=/mingw64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVIOSPICE_BUILD_FLUXSCRIPT=ON -G "MSYS Makefiles"

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel $(nproc)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel $(nproc)

      - name: Smoke test VioraEDA (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          QT_QPA_PLATFORM=offscreen timeout 10 ./build/VioraEDA 2>&1
          rc=$?
          if [ $rc -eq 124 ]; then
            echo "PASS: VioraEDA started and stayed running (killed by timeout)"
          elif [ $rc -eq 0 ]; then
            echo "PASS: VioraEDA started and exited cleanly"
          else
            echo "FAIL: VioraEDA crashed (exit code $rc)"
            exit $rc
          fi

      - name: Smoke test VioraEDA (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          timeout 10 ./build/VioraEDA.exe 2>&1
          rc=$?
          if [ $rc -eq 124 ]; then
            echo "PASS: VioraEDA started and stayed running (killed by timeout)"
          elif [ $rc -eq 0 ]; then
            echo "PASS: VioraEDA started and exited cleanly"
          else
            echo "FAIL: VioraEDA crashed (exit code $rc)"
            exit $rc
          fi

      - name: Unit tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."
