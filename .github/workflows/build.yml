name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" linux desktop 6.10.0 linux_gcc_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" mac desktop 6.10.0 clang_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/macos/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y software-properties-common ccache
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            llvm-21-dev \
            python3 python3-dev \
            ngspice
          # Prebuilt ngspice deps (compiled on older Ubuntu): libssl1.1, libldap-2.4
          for pkg in \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openldap/libldap-2.4-2_2.4.49+dfsg-2ubuntu1.10_amd64.deb; do
            wget -qO /tmp/pkg.deb "$pkg" && sudo dpkg -i /tmp/pkg.deb || true
          done
          sudo apt-get install -f -y

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake curl python@3.12 ccache

      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      - name: Setup MSYS2 + Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-llvm
            zip

      - name: Set Qt6_DIR (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "Qt6_DIR=/mingw64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DVIOSPICE_BUILD_FLUXSCRIPT=ON -G "MSYS Makefiles"

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel $(nproc)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel $(nproc)

      - name: Smoke test VioraEDA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ldconfig
          ldd ./build/VioraEDA 2>&1 | grep "not found" || echo "All libraries found"
          set +e
          QT_QPA_PLATFORM=offscreen ./build/VioraEDA &
          pid=$!
          sleep 8
          kill $pid 2>/dev/null
          wait $pid
          rc=$?
          set -e
          if [ $rc -eq 0 ] || [ $rc -ge 128 ]; then
            echo "PASS: VioraEDA started without crashing (exit code $rc)"
          else
            echo "FAIL: VioraEDA crashed (exit code $rc)"
            exit $rc
          fi

      - name: Smoke test VioraEDA (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen ./build/VioraEDA &
          pid=$!
          sleep 8
          kill $pid 2>/dev/null
          wait $pid
          rc=$?
          set -e
          if [ $rc -eq 0 ] || [ $rc -ge 128 ]; then
            echo "PASS: VioraEDA started without crashing (exit code $rc)"
          else
            echo "FAIL: VioraEDA crashed (exit code $rc)"
            exit $rc
          fi

      - name: Smoke test VioraEDA (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          # Copy DLLs into build/ so Windows loader finds them
          cp -av /mingw64/bin/*.dll build/ 2>/dev/null || true
          cp -v /mingw64/bin/libpython3.14.dll build/python314.dll 2>&1 || true
          cp -v build/viomatrixc-prebuilt/bin/libngspice-0.dll build/ 2>&1 || true
          for pdir in /mingw64/share/qt6/plugins /mingw64/plugins /mingw64/lib/qt6/plugins; do
            if [ -f "$pdir/platforms/qwindows.dll" ]; then
              mkdir -p build/platforms
              cp -v "$pdir/platforms/qwindows.dll" build/platforms/ 2>&1 || true
              break
            fi
          done
          echo "=== DLL dependency check ==="
          # Check for unresolved DLLs using ldd
          which ldd 2>/dev/null && ldd build/VioraEDA.exe 2>&1 | grep -i "not found" || echo "(ldd not available or no unresolved)"
          # Also check with objdump -p on the exe and all copied DLLs for recursive deps
          echo "=== file info ==="
          file build/VioraEDA.exe 2>&1 || true
          # Launch VioraEDA.exe (GUI). Use Windows tasklist to verify it runs.
          set +e
          echo "=== launching VioraEDA.exe ==="
          QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=windows \
            ./build/VioraEDA.exe &
          pid=$!
          sleep 5
          if tasklist.exe 2>/dev/null | grep -iq "VioraEDA"; then
            echo "=== process confirmed alive via tasklist ==="
            taskkill.exe /F /IM VioraEDA.exe 2>/dev/null || true
            echo "PASS: VioraEDA GUI launched and ran"
          else
            wait $pid 2>/dev/null
            rc=$?
            echo "FAIL: VioraEDA GUI exited early (code $rc)"
            exit 1
          fi
          set -e

      - name: Unit tests (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."
