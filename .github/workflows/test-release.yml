name: Test Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v0.1.0-beta)
        required: true
        type: string
  release:
    types: [published]

jobs:
  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            -p "*-windows-*" \
            -O /tmp/release.zip \
            --clobber

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-unzip
            mingw-w64-x86_64-coreutils
            zip

      - name: Extract
        shell: msys2 {0}
        run: |
          mkdir -p /tmp/testdir
          unzip -o /tmp/release.zip -d /tmp/testdir
          echo "--- contents ---"
          find /tmp/testdir -type f | head -50

      - name: Test 1 — DLL dependency check
        shell: msys2 {0}
        run: |
          set -e
          FAIL=0
          for exe in VioraEDA.exe viora.exe flux_runner.exe; do
            echo "=== Checking deps for $exe ==="
            deps=$(objdump -p "/tmp/testdir/bin/$exe" 2>/dev/null | grep "DLL Name" | awk '{print $3}')
            for dll in $deps; do
              case "$dll" in
                KERNEL32.dll|USER32.dll|GDI32.dll|ADVAPI32.dll|SHELL32.dll|OLE32.dll|OLEAUT32.dll|COMDLG32.dll|IMM32.dll|WINMM.dll|WS2_32.dll|MSVCRT.dll|VERSION.dll|SHLWAPI.dll|COMCTL32.dll|UxTheme.dll|WINSPOOL.DRV|MSIMG32.dll|USP10.dll|DNSAPI.dll|IPHLPAPI.DLL|OPENGL32.dll|GLU32.dll|DDRAW.dll|DCIMAN32.dll|SETUPAPI.dll|CFGMGR32.dll|DEVRTL.dll|NTMARTA.dll|WLDAP32.dll|CRYPT32.dll|WTSAPI32.dll|Secur32.dll|WINTRUST.dll|OLEACC.dll|RICHED20.dll|WINSTA.dll|LZ32.dll|MPR.dll|NETAPI32.dll|POWRPROF.dll|PROPSYS.dll|DWMAPI.dll|bcrypt.dll)
                  continue ;;
                python3*.dll)
                  if [ -f "/tmp/testdir/bin/$dll" ]; then
                    echo "  OK $dll"
                  else
                    echo "  MISSING $dll"
                    FAIL=$((FAIL+1))
                  fi
                  continue ;;
              esac
              if [ -f "/tmp/testdir/bin/$dll" ]; then
                echo "  OK $dll"
              else
                echo "  MISSING $dll"
                FAIL=$((FAIL+1))
              fi
            done
          done
          echo "Missing DLLs: $FAIL"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
          echo "All DLL deps satisfied"

      - name: Test 2 — Launch test
        shell: msys2 {0}
        run: |
          set -e
          for exe in VioraEDA.exe flux_runner.exe; do
            echo "=== Launching $exe ==="
            timeout 10 "/tmp/testdir/bin/$exe" --help 2>&1 && echo "  OK $exe" || \
              echo "  ~ $exe exited $? (may be expected for GUI app)"
          done
          echo "=== Launching viora.exe (CLI) ==="
          "/tmp/testdir/bin/viora.exe" --help 2>&1 && echo "  OK viora"

      - name: Test 3 — Simulation test (CLI)
        shell: msys2 {0}
        run: |
          set -e
          cat > /tmp/testdir/test.cir << 'EOF'
          * Test netlist
          V1 1 0 DC 5
          R1 1 0 1k
          .op
          .end
          EOF
          echo "=== Running DC simulation via viora ==="
          "/tmp/testdir/bin/viora.exe" -b /tmp/testdir/test.cir -r /tmp/testdir/out.raw 2>&1 || true
          if [ -f "/tmp/testdir/out.raw" ]; then
            echo "  OK Simulation produced output file"
          else
            echo "  WARN No output file — ngspice engine may not load"
          fi

      - name: Print summary
        shell: msys2 {0}
        run: |
          echo "=== Package summary ==="
          du -sh /tmp/testdir
          du -sh /tmp/testdir/bin/*
          echo ""
          echo "All tests completed"
