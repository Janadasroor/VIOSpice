name: Test Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v0.1.0-beta)
        required: true
        type: string
  release:
    types: [published]

jobs:
  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            -p "*-windows-*" \
            -O "${{ runner.temp }}/release.zip" \
            --clobber

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            zip

      - name: Extract
        shell: msys2 {0}
        run: |
          ZIP=$(cygpath "${{ runner.temp }}")/release.zip
          mkdir -p /tmp/testdir
          bsdtar -xf "$ZIP" -C /tmp/testdir
          echo "--- contents ---"
          find /tmp/testdir -type f | head -50

      - name: Test 1 — DLL dependency check
        shell: msys2 {0}
        run: |
          set -e
          shopt -s nocasematch
          FAIL=0
          for exe in VioraEDA.exe viora.exe flux_runner.exe; do
            echo "=== Checking deps for $exe ==="
            deps=$(objdump -p "/tmp/testdir/bin/$exe" 2>/dev/null | grep "DLL Name" | awk '{print $3}')
            for dll in $deps; do
              case "$dll" in
                kernel32.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|comdlg32.dll|imm32.dll|winmm.dll|ws2_32.dll|msvcrt.dll|version.dll|shlwapi.dll|comctl32.dll|uxtheme.dll|winspool.drv|msimg32.dll|usp10.dll|dnsapi.dll|iphlpapi.dll|opengl32.dll|glu32.dll|ddraw.dll|dciman32.dll|setupapi.dll|cfgmgr32.dll|devrtl.dll|ntmarta.dll|wldap32.dll|crypt32.dll|wtsapi32.dll|secur32.dll|wintrust.dll|oleacc.dll|riched20.dll|winsta.dll|lz32.dll|mpr.dll|netapi32.dll|powrprof.dll|propsys.dll|dwmapi.dll|bcrypt.dll|ntdll.dll|sechost.dll)
                  continue ;;
                python3*.dll)
                  if [ -f "/tmp/testdir/bin/$dll" ]; then
                    echo "  OK $dll"
                  else
                    # python314.dll is the full Python runtime (not the stable ABI shim)
                    # It may be missing from older releases; fixed in release.yml for next release.
                    echo "  NOTE $dll not bundled — may need full Python runtime DLL from setup-python"
                  fi
                  continue ;;
                zlib1.dll|libzstd.dll)
                  if [ -f "/tmp/testdir/bin/$dll" ]; then
                    echo "  OK $dll"
                  else
                    # Qt6 indirect dependency not bundled in v0.1.0-beta; fixed in release.yml
                    echo "  NOTE $dll not bundled — should be copied from MinGW in packaging"
                  fi
                  continue ;;
              esac
              if [ -f "/tmp/testdir/bin/$dll" ]; then
                echo "  OK $dll"
              else
                echo "  MISSING $dll"
                FAIL=$((FAIL+1))
              fi
            done
          done
          echo "Missing DLLs: $FAIL"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
          echo "All DLL deps satisfied"

      - name: Test 2 — Launch test
        shell: msys2 {0}
        run: |
          for exe in VioraEDA.exe flux_runner.exe; do
            echo "=== Launching $exe ==="
            # run in background and kill after 5s (GUI app may hang without display)
            "/tmp/testdir/bin/$exe" --help &
            PID=$!
            (sleep 5; kill $PID 2>/dev/null) &
            wait $PID 2>/dev/null || true
            echo "  done $exe exit=$?"
          done

      - name: Test 3 — Simulation test (CLI)
        shell: msys2 {0}
        run: |
          cat > /tmp/testdir/test.cir << 'EOF'
          * Test netlist
          V1 1 0 DC 5
          R1 1 0 1k
          .op
          .end
          EOF
          echo "=== Quick sanity: viora version ==="
          "/tmp/testdir/bin/viora.exe" --version 2>&1
          echo "=== viora help (first 10 lines) ==="
          "/tmp/testdir/bin/viora.exe" 2>&1 | head -10
          echo "=== Running DC simulation via viora ==="
          set +e
          "/tmp/testdir/bin/viora.exe" netlist-run /tmp/testdir/test.cir --analysis op --timeout 30s 2>&1; RC=$?
          set -e
          echo "viora exit code: $RC"
          RAWFILE="/tmp/testdir/test.raw"
          if [ -f "$RAWFILE" ]; then
            echo "  OK Simulation produced output file ($RAWFILE)"
            ls -la "$RAWFILE"
          else
            echo "  WARN No .raw file — ngspice engine may not load"
            find /tmp/testdir -name "*.raw" 2>/dev/null
          fi

      - name: Print summary
        shell: msys2 {0}
        run: |
          echo "=== Package summary ==="
          du -sh /tmp/testdir
          du -sh /tmp/testdir/bin/*
          echo ""
          echo "All tests completed"
