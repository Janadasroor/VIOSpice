name: Release VioraEDA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir_suffix: gcc_64
          - os: macos-15
            qt_host: mac
            qt_arch: clang_64
            qt_dir_suffix: macos
          - os: windows-2022
            qt_host: windows
            qt_arch: win64_mingw
            qt_dir_suffix: mingw64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" ${{ matrix.qt_host }} desktop 6.10.0 ${{ matrix.qt_arch }} -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/${{ matrix.qt_dir_suffix }}/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" ${{ matrix.qt_host }} desktop 6.10.0 ${{ matrix.qt_arch }} -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/${{ matrix.qt_dir_suffix }}/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Setup MSYS2 + Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-llvm
            zip

      - name: Set Qt6_DIR (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "Qt6_DIR=/mingw64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y software-properties-common ccache
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            llvm-21-dev \
            python3 python3-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake curl python@3.12 ccache

      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVIOSPICE_BUILD_FLUXSCRIPT=ON -G "MSYS Makefiles"

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel $(nproc)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel $(nproc)

      - name: Run tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure || true

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure || true

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging/bin staging/cm staging/lib
          cp build/VioraEDA staging/bin/
          cp build/viora staging/bin/ 2>/dev/null || true
          cp build/flux_runner staging/bin/ 2>/dev/null || echo "no flux_runner"
          cp build/libLLVM.so.21.1 staging/lib/ 2>/dev/null || true
          # Code models (.cm)
          cp -r build/cm/. staging/cm/ 2>/dev/null || true
          if [ -z "$(ls -A staging/cm 2>/dev/null)" ]; then
            for f in build/viomatrixc-prebuilt/lib/ngspice/*.cm; do
              [ -f "$f" ] && cp "$f" staging/cm/
            done
          fi
          # Bundle engine libs
          if [ -d "build/viomatrixc-prebuilt/lib" ]; then
            cp build/viomatrixc-prebuilt/lib/*.so* staging/lib/ 2>/dev/null || true
          fi
          tar czf VioraEDA-${{ github.ref_name }}-linux-x86_64.tar.gz -C staging .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging/bin staging/cm staging/lib
          cp build/VioraEDA.app/Contents/MacOS/VioraEDA staging/bin/ 2>/dev/null || \
          cp build/VioraEDA staging/bin/ 2>/dev/null || true
          cp build/viora staging/bin/ 2>/dev/null || true
          cp build/flux_runner staging/bin/ 2>/dev/null || echo "no flux_runner"
          # Code models (.cm)
          cp -r build/cm/. staging/cm/ 2>/dev/null || true
          if [ -z "$(ls -A staging/cm 2>/dev/null)" ]; then
            for f in build/viomatrixc-prebuilt/lib/ngspice/*.cm; do
              [ -f "$f" ] && cp "$f" staging/cm/
            done
          fi
          cp build/viomatrixc-prebuilt/lib/*.dylib staging/lib/ 2>/dev/null || true
          tar czf VioraEDA-${{ github.ref_name }}-macos-arm64.tar.gz -C staging .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          mkdir -p staging/bin staging/cm
          cp build/VioraEDA.exe staging/bin/
          cp build/viora.exe staging/bin/ 2>/dev/null || echo "no viora.exe"
          cp build/flux_runner.exe staging/bin/ 2>/dev/null || echo "no flux_runner.exe"
          # Code models (.cm) — from build/cm/ (CMake copies them) or direct from prebuilt
          cp -r build/cm/. staging/cm/ 2>/dev/null || true
          if [ -z "$(ls -A staging/cm 2>/dev/null)" ]; then
            # Fallback: prebuilt VioMATRIXC stores .cm in lib/ngspice/
            for f in build/viomatrixc-prebuilt/lib/ngspice/*.cm; do
              [ -f "$f" ] && cp "$f" staging/cm/ || echo "no cm files found"
            done
          fi
          # VioMATRIXC / ngspice engine DLL — put next to exe (Windows has no RPATH)
          cp build/viomatrixc-prebuilt/bin/*.dll staging/bin/ 2>/dev/null || echo "no vmc dlls"
          # LLVM DLLs (needed by flux_runner runtime)
          cp /mingw64/bin/LLVM-C*.dll staging/bin/ 2>/dev/null || echo "no LLVM-C*.dll"
          cp /mingw64/bin/libLLVM*.dll staging/bin/ 2>/dev/null || echo "no libLLVM*.dll"
          cp /mingw64/bin/LLVM*.dll staging/bin/ 2>/dev/null || echo "no LLVM*.dll"
          # MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll staging/bin/ 2>/dev/null || echo "no libgcc"
          cp /mingw64/bin/libstdc++-6.dll staging/bin/ 2>/dev/null || echo "no libstdc++"
          cp /mingw64/bin/libwinpthread-1.dll staging/bin/ 2>/dev/null || echo "no libwinpthread"
          # Python DLL (embedded) — stable ABI shim + full runtime from hosted Python
          PY_HOST=$(ls -d /c/hostedtoolcache/windows/Python/3.*/x64 2>/dev/null | head -1)
          if [ -n "$PY_HOST" ] && [ -d "$PY_HOST" ]; then
            cp "$PY_HOST/python3.dll" staging/bin/ 2>/dev/null && echo "copied python3.dll" || true
            cp "$PY_HOST/python3*.dll" staging/bin/ 2>/dev/null && echo "copied python DLLs" || true
            # Also bundle the stable ABI shim + full python3*.dll (e.g. python314.dll)
          elif [ -d "/mingw64/bin" ]; then
            cp /mingw64/bin/python3*.dll staging/bin/ 2>/dev/null || echo "no msys2 python dll"
          fi
          # Bundle Qt DLLs
          windeployqt --dir staging/bin staging/bin/VioraEDA.exe
          cd staging
          zip -r ../VioraEDA-${{ github.ref_name }}-windows-x86_64.zip .
          cd ..

      - name: Verify package contents (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          MISSING=0
          check_file() {
            if ! unzip -l VioraEDA-${{ github.ref_name }}-windows-x86_64.zip | grep -q "$1"; then
              echo "MISSING: $1"
              MISSING=1
            fi
          }
          check_file "bin/VioraEDA.exe"
          check_file "bin/viora.exe"
          check_file "bin/flux_runner.exe"
          check_file "bin/libngspice-0.dll"
          check_file "bin/libgcc_s_seh-1.dll"
          check_file "bin/libstdc++-6.dll"
          check_file "bin/libwinpthread-1.dll"
          check_file "bin/python3.dll"
          check_file "cm/analog.cm"
          check_file "cm/digital.cm"
          if [ "$MISSING" -eq 1 ]; then
            echo "ERROR: required files missing from package"
            exit 1
          fi
          echo "All required files present"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VioraEDA-*-linux-x86_64.tar.gz
            VioraEDA-*-macos-arm64.tar.gz
            VioraEDA-*-windows-x86_64.zip
