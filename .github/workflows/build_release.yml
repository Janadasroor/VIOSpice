name: Build & Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform_name: linux-x86_64
            qt_arch: gcc_64
          - os: windows-2022
            platform_name: windows-x64
            qt_arch: win64_msvc2019_64
          - os: macos-14
            platform_name: macos-arm64
            qt_arch: clang_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Viora Component Libraries
        shell: bash
        run: |
          git clone https://github.com/Janadasroor/viora-libs.git ~/viora-libs

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache mold \
            libgl1-mesa-dev libglu1-mesa-dev libx11-xcb-dev libxcb-glx0-dev \
            libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
            ngspice libngspice0-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja ccache ngspice llvm

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtcharts qtmultimedia'
          cache: true

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVIOSPICE_ENABLE_TESTS=ON \
            -DVIOSPICE_DEV_MODE=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DVIOSPICE_ENABLE_TESTS=ON ^
            -DVIOSPICE_DEV_MODE=OFF

      - name: Build Application & Test Suite
        run: |
          cmake --build build --config Release -j4

      - name: Run Test Suite
        run: |
          ctest --test-dir build --output-on-failure -E "production_validation"

      - name: Package Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/viospice-linux-x86_64
          cp build/viora package/viospice-linux-x86_64/
          cp -r ~/viora-libs package/viospice-linux-x86_64/viora-libs || true
          tar -czvf viospice-${{ matrix.platform_name }}.tar.gz -C package viospice-linux-x86_64

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p package/viospice-windows-x64
          cp build/viora.exe package/viospice-windows-x64/ || cp build/Release/viora.exe package/viospice-windows-x64/ || true
          windeployqt --no-compiler-runtime package/viospice-windows-x64/viora.exe || true
          7z a viospice-${{ matrix.platform_name }}.zip ./package/viospice-windows-x64/*

      - name: Package Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package/viospice-macos-arm64
          cp build/viora package/viospice-macos-arm64/ || cp -r build/viora.app package/viospice-macos-arm64/ || true
          macdeployqt package/viospice-macos-arm64/viora.app -dmg || true
          zip -r viospice-${{ matrix.platform_name }}.zip package/viospice-macos-arm64

      - name: Upload Artifacts (Build)
        uses: actions/upload-artifact@v4
        with:
          name: viospice-${{ matrix.platform_name }}
          path: |
            *.tar.gz
            *.zip
            *.dmg

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Downloaded Files
        run: ls -R artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
